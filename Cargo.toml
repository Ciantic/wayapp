[package]
name = "wayapp"
description = "A Wayland application wrapper using smithay-client-toolkit, supports currently just egui using wgpu"
version = "0.4.0"
license-file = "LICENSE.txt"
repository = "https://github.com/Ciantic/wayapp"
homepage = "https://github.com/Ciantic/wayapp"
edition = "2024"

[dependencies]
log = "0.4.34"
smithay-client-toolkit = "0.21.1"
smithay-clipboard = "0.7.3"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = "0.32.13"
wayland-protocols-wlr = "0.3.12"

# Used only by egui/wgpu backend
futures = "0.3.34"
egui = "0.36.2"
egui-wgpu = "0.36.2"
raw-window-handle = "0.6.2"
wgpu = "30.0.1"

[dev-dependencies]
env_logger = "0.11.11"
tokio = { version = "1.53.1", features = [
    "rt",
    "time",
    "net",
    "macros",
    "rt-multi-thread",
    "sync",
] }
hotpath = { version = "0.26.0", features = ["hotpath", "hotpath-alloc"] }

[lib]
name = "wayapp"
path = "src/lib.rs"

[features]
_example = []

[[example]]
name = "egui_tokio_async"
required-features = ["_example"]
